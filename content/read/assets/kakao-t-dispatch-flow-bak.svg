<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">카카오 T 택시 호출 흐름</title>
<desc id="desc">승객 앱이 서버에 호출을 보냅니다. 서버는 기사 후보를 골라 기사 앱에 콜 카드를 보냅니다. 기사 수락이 서버에 돌아오고 배차가 확정되면 두 앱에 결과를 표시합니다.</desc>
<style>
  :root {
    color-scheme: light dark;
    --ink: #172238;
    --card: #f5f7fa;
    --border: #aab6ce;
    --accent-card: #e1efff;
    --title: #000000;
    --stage: #28578a;
    --muted: #737f90;
    --caption: #717d8e;
    --number: #415679;
    --icon: #224c80;
    --arrow: #38577d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #f0f4fc;
      --card: #202b3d;
      --border: #5c6d88;
      --accent-card: #304968;
      --title: #f0f4fc;
      --stage: #b4d3ff;
      --muted: #aab7ca;
      --caption: #a5b3c6;
      --number: #c0cdeb;
      --icon: #a8caff;
      --arrow: #a8caff;
    }
  }
</style>
