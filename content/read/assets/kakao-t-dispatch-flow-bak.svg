<g transform="translate(76 37)" fill="none" stroke="var(--icon)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="m13 31 6-13h26l6 13M10 48V35l5-4h34l5 4v13H10Zm7 0v6m30-6v6M19 39h5m16 0h5"/></g>
<text x="108" y="135" text-anchor="middle" font-size="27" font-weight="bold" fill="var(--stage)">배차 확정</text>
<text x="108" y="169" text-anchor="middle" font-size="16">승객·기사 앱에 결과 표시</text>
<text x="108" y="198" text-anchor="middle" font-size="14" fill="var(--muted)">상태 동기화</text>
