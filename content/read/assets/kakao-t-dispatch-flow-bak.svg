<g transform="translate(76 37)" fill="none" stroke="var(--icon)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="14" width="50" height="36" rx="6"/><path d="M17 26h30M17 37h19"/></g>
<text x="108" y="135" text-anchor="middle" font-size="27" font-weight="bold" fill="var(--stage)">콜 카드 전달</text>
