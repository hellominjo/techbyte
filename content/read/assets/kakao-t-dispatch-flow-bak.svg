<g transform="translate(76 37)" fill="none" stroke="var(--icon)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="23"/><path d="m20 32 8 8 16-17"/></g>
<text x="108" y="135" text-anchor="middle" font-size="27" font-weight="bold" fill="var(--stage)">기사 수락</text>
<text x="108" y="169" text-anchor="middle" font-size="16">수락 응답이 서버로</text>
<text x="108" y="198" text-anchor="middle" font-size="14" fill="var(--muted)">요청 · 응답</text>
</g><path d="M940 194h10m-5-5 5 5-5 5" fill="none" stroke="var(--arrow)" stroke-width="2.5"/>
<g transform="translate(952 88)">
<rect width="216" height="224" rx="16" fill="var(--accent-card)" stroke="var(--border)"/>
