<g transform="translate(76 37)" fill="none" stroke="var(--icon)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="18" y="7" width="28" height="50" rx="5"/><path d="M24 15h16M29 49h6"/></g>
<text x="108" y="135" text-anchor="middle" font-size="27" font-weight="bold" fill="var(--stage)">호출 요청</text>
