<text x="15" y="30" font-size="18" font-weight="bold" fill="#415679">03</text>
<g transform="translate(76 37)" fill="none" stroke="#224c80" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="14" width="50" height="36" rx="6"/><path d="M17 26h30M17 37h19"/></g>
<text x="108" y="135" text-anchor="middle" font-size="27" font-weight="bold">콜 카드 전달</text>
<text x="108" y="169" text-anchor="middle" font-size="16">기사 앱에 호출 제안</text>
</g><path d="M710 194h10m-5-5 5 5-5 5" fill="none" stroke="#38577d" stroke-width="2.5"/>
<g transform="translate(722 88)">
<rect width="216" height="212" rx="16" fill="white" stroke="#aab6ce"/>
<text x="15" y="30" font-size="18" font-weight="bold" fill="#415679">04</text>
<g transform="translate(76 37)" fill="none" stroke="#224c80" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="23"/><path d="m20 32 8 8 16-17"/></g>
<text x="108" y="135" text-anchor="middle" font-size="27" font-weight="bold">기사 수락</text>
<text x="108" y="169" text-anchor="middle" font-size="16">수락 응답이 서버로</text>
</g><path d="M940 194h10m-5-5 5 5-5 5" fill="none" stroke="#38577d" stroke-width="2.5"/>
<g transform="translate(952 88)">
<rect width="216" height="212" rx="16" fill="#fff0a3" stroke="#aab6ce"/>
<text x="15" y="30" font-size="18" font-weight="bold" fill="#415679">05</text>
<g transform="translate(76 37)" fill="none" stroke="#224c80" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="m13 31 6-13h26l6 13M10 48V35l5-4h34l5 4v13H10Zm7 0v6m30-6v6M19 39h5m16 0h5"/></g>
<text x="108" y="135" text-anchor="middle" font-size="27" font-weight="bold">배차 확정</text>
<text x="108" y="169" text-anchor="middle" font-size="16">승객·기사 앱에 결과 표시</text>
