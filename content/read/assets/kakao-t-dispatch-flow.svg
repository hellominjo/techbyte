<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">카카오 T 택시 호출 흐름</title>
<desc id="desc">승객 앱이 서버에 호출을 보냅니다. 서버는 기사 후보를 골라 기사 앱에 콜 카드를 보냅니다. 기사 수락이 서버에 돌아오고 배차가 확정되면 두 앱에 결과를 표시합니다.</desc>
<rect width="1200" height="360" rx="24" fill="#f5f7fa"/>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" fill="#172238">
<text x="32" y="56" font-size="36" font-weight="bold">카카오 T 택시 호출 흐름</text>
<g transform="translate(32 88)">
<rect width="216" height="212" rx="16" fill="white" stroke="#aab6ce"/>
<text x="15" y="30" font-size="18" font-weight="bold" fill="#415679">01</text>
<g transform="translate(76 37)" fill="none" stroke="#224c80" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="18" y="7" width="28" height="50" rx="5"/><path d="M24 15h16M29 49h6"/></g>
<text x="108" y="135" text-anchor="middle" font-size="27" font-weight="bold">호출 요청</text>
<text x="108" y="169" text-anchor="middle" font-size="16">출발지·목적지 전송</text>
</g><path d="M250 194h10m-5-5 5 5-5 5" fill="none" stroke="#38577d" stroke-width="2.5"/>
<g transform="translate(262 88)">
<rect width="216" height="212" rx="16" fill="white" stroke="#aab6ce"/>
<text x="15" y="30" font-size="18" font-weight="bold" fill="#415679">02</text>
<g transform="translate(76 37)" fill="none" stroke="#224c80" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M48 25c0 13-16 27-16 27S16 38 16 25a16 16 0 1 1 32 0Z"/><circle cx="32" cy="25" r="5"/></g>
<text x="108" y="135" text-anchor="middle" font-size="27" font-weight="bold">기사 후보 탐색</text>
<text x="108" y="169" text-anchor="middle" font-size="16">배차 서버가 후보 선정</text>
</g><path d="M480 194h10m-5-5 5 5-5 5" fill="none" stroke="#38577d" stroke-width="2.5"/>
<g transform="translate(492 88)">
